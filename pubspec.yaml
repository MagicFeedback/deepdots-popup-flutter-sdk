name: deepdots_popups
description: "Deepdots popups and surveys for Flutter apps, on top of the native Deepdots SDK for Android and iOS."
version: 1.1.0
homepage: https://deepdots.com
repository: https://github.com/MagicFeedback/deepdots-popup-flutter-sdk
issue_tracker: https://github.com/MagicFeedback/deepdots-popup-flutter-sdk/issues
documentation: https://docs.deepdots.com/popup-flutter/
topics: [survey, feedback, popup, analytics]
screenshots:
  - description: A Deepdots survey popup on Android.
    path: doc/screenshots/android-survey.png
  - description: A Deepdots survey popup on iOS.
    path: doc/screenshots/ios-survey.png

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.deepdots.deepdots_popups
        pluginClass: DeepdotsPopupsPlugin
      ios:
        pluginClass: DeepdotsPopupsPlugin
